name: CI

# 推 main 只跑 docker.yml（镜像构建）；质量校验放到 PR 和手动触发，
# 避免每次推代码都同时抢 3 个 runner。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: node --test tests/*.test.ts

      - name: Build web
        run: npx vite build
