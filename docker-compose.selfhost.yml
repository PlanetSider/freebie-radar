# ============================================================
# 自建版 docker-compose（单人 / 家庭服务器）
#
#   docker compose -f docker-compose.selfhost.yml up -d
#
# 特点：
#   - 不需要 .env 文件，所有变量都写在下面，改完直接 up -d 生效
#   - 镜像由 GitHub Actions 构建并推送到 GHCR，不在本地 build
#   - 只保留常改的 19 个变量，其余高级项见文件末尾注释，需要时再加一行
#   - FlareSolverr 默认随本文件启动，不需要 --profile
#
# 与 docker-compose.yml 的区别：那份保留 .env 工作流，这份把变量内联。
# 二者互斥使用，不要同时 up。
# ============================================================
services:
  radar:
    # 镜像地址与 GitHub 仓库一一对应（小写）。首次推送后去
    # https://github.com/users/你的用户名/packages 把该包设为 Public，
    # 否则匿名 pull 会失败；私有镜像先 docker login ghcr.io -u 你的用户名。
    image: ghcr.io/planetsider/freebie-radar:latest
    restart: unless-stopped
    mem_limit: 256m
    # 默认只绑回环，交给 Nginx/Caddy 反代并上 HTTPS。
    # 直接用 IP:端口 访问就改成 "0.0.0.0:8788:8788"（不推荐公网裸奔）。
    ports:
      - "127.0.0.1:8788:8788"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - flaresolverr
    environment:
      # ---------------- 基础（一般不用改） ----------------
      # 容器内固定监听 8788，改了要和上面 ports 右侧保持一致
      PORT: "8788"
      HOST: "0.0.0.0"
      # 必须是 /data 下的路径，否则数据不会写进挂载卷，重建容器即丢
      DATABASE_PATH: /data/radar.db
      # 影响 cron 触发时刻与日报日期归属
      TZ: "Asia/Shanghai"

      # ---------------- 必填：管理密码与对外地址 ----------------
      # 管理区密码。留空时：selfhost 模式管理区开放、public 模式锁定。
      # 公网部署必须填长随机串（可用 openssl rand -base64 24 生成）。
      ADMIN_TOKEN: ""
      # 对外访问地址，OAuth 回调与 RSS 绝对链接依赖它，如 https://radar.example.com
      PUBLIC_BASE_URL: ""

      # ---------------- 站点形态 ----------------
      # auto     = 配齐任一 OAuth 凭据就按公开站跑
      # selfhost = 强制单人自建（全局收藏/屏蔽，行为与旧版一致）
      # public   = 公开站，个人状态按登录用户隔离
      SITE_MODE: "auto"

      # ---------------- 采集 ----------------
      ENABLE_SCHEDULER: "true"
      MAX_ITEMS_PER_RUN: "50"
      # GitHub API Token，把限额从 60/h 提到 5000/h（可选）
      GITHUB_TOKEN: ""
      # 国内本机/海外 VPS 都留空；需要翻墙采集才填，如 http://127.0.0.1:7890
      HTTP_PROXY: ""
      HTTPS_PROXY: ""

      # ---------------- Cloudflare 绕过（本文件已默认启动 flaresolverr） ----------------
      FLARESOLVERR_URL: "http://flaresolverr:8191"

      # ---------------- 全局 Telegram 推送（可选） ----------------
      # none = 只网页查看；telegram = 开启全局 Bot 即时/攒批/日报。
      # 置 none 时下面两项留空即可，个人 Bot 推送仍可独立工作。
      PUSH_CHANNEL: "none"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""

      # ---------------- AI 语义审核（可选） ----------------
      # 这里只是「首次启动的默认值」，之后在网页「AI 引擎」里热改即可；
      # 只要在网页保存过一次，这几项就永久失效，可留空。
      AI_BASE_URL: ""
      AI_API_KEY: ""
      AI_MODEL: ""

      # ---------------- 以下高级项默认不写，需要时照名字加一行 ----------------
      # 安全：ADMIN_HOSTS / TRUST_PROXY / RATE_LIMIT_ENABLED / WEBHOOK_ALLOW_PRIVATE
      # 代理：FETCH_TIMEOUT_MS / MIN_REQUEST_GAP_MS / SOURCE_GAP_MS
      # 采集：ENABLED_SOURCES / INGEST_TOKEN / COOKIE_RUNNER_URL / XHS_PROXY_URL
      # 调度：COLLECT_CRON / DAILY_CRON / DAILY_TOP_N
      # 推送：TELEGRAM_API_BASE / TELEGRAM_PROXY / USER_PUSH_MAX_PER_HOUR / USER_PUSH_MAX_PER_INSTANT
      # AI：AI_MAX_ITEMS
      # CF：FLARESOLVERR_TIMEOUT_MS
      # 站点：LINUXDO_CLIENT_ID / LINUXDO_CLIENT_SECRET / LINUXDO_REDIRECT_URI / LINUXDO_MIN_TRUST_LEVEL / LINUXDO_PROXY
      #       GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET / GITHUB_REDIRECT_URI / GITHUB_PROXY
      # 密钥：SESSION_SECRET / TOKEN_ENCRYPTION_KEY
      # 其他：AUTH_DEV_MOCK / GUEST_HIDDEN_CATEGORIES
      # 自更新：SELF_UPDATE_REMOTE / SELF_UPDATE_BRANCH / SELF_UPDATE_RESTART_CMD
      #         UPDATE_WEBHOOK_URL / UPDATE_WEBHOOK_TOKEN / APP_COMMIT / APP_BUILD_TIME / APP_REPO
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Cloudflare 挑战求解，供 linux.do 等带护盾的站点采集使用。
  # 不需要时：删掉本服务，并删掉上面 depends_on 与 FLARESOLVERR_URL 两处。
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    mem_limit: 400m
    environment:
      LOG_LEVEL: info
      TZ: "Asia/Shanghai"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"